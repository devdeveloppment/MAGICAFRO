{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion Administrateur | MagicAfro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Outfit', sans-serif; }
        .gradient-bg {
            background: linear-gradient(135deg, #1a1a1a 0%, #3d2b1f 100%);
        }
        .glass {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body class="gradient-bg min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full">
        <!-- Logo -->
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-white tracking-tight">MAGIC<span class="text-orange-400">AFRO</span></h1>
            <p class="text-gray-400 text-sm mt-2">Espace Gestion Administrateur</p>
        </div>

        <!-- Login Card -->
        <div class="glass p-8 rounded-3xl shadow-2xl">
            <h2 class="text-xl font-semibold text-white mb-6 text-center">Connexion</h2>
            
            {% if messages %}
            <div class="mb-6">
                {% for message in messages %}
                <div class="p-3 rounded-xl bg-red-500/20 border border-red-500/50 text-red-200 text-xs flex items-center">
                    <i class="fa-solid fa-circle-exclamation mr-2"></i>
                    {{ message }}
                </div>
                {% endfor %}
            </div>
            {% endif %}

            <form method="POST" class="space-y-5">
                {% csrf_token %}
                <div>
                    <label class="block text-gray-400 text-xs font-bold uppercase tracking-widest mb-2">Adresse E-mail</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-4 flex items-center text-gray-500">
                            <i class="fa-solid fa-envelope"></i>
                        </span>
                        <input type="email" name="email" required 
                            class="w-full bg-white/5 border border-white/10 rounded-2xl py-4 pl-12 pr-4 text-white placeholder-gray-600 focus:outline-none focus:ring-2 focus:ring-orange-400/50 transition"
                            placeholder="votre@email.com">
                    </div>
                </div>

                <div>
                    <label class="block text-gray-400 text-xs font-bold uppercase tracking-widest mb-2">Mot de passe</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-4 flex items-center text-gray-500">
                            <i class="fa-solid fa-lock"></i>
                        </span>
                        <input type="password" name="password" required 
                            class="w-full bg-white/5 border border-white/10 rounded-2xl py-4 pl-12 pr-4 text-white placeholder-gray-600 focus:outline-none focus:ring-2 focus:ring-orange-400/50 transition">
                    </div>
                </div>

                <div class="pt-4">
                    <button type="submit" class="w-full bg-orange-400 hover:bg-orange-500 text-black font-bold py-4 rounded-2xl shadow-lg transition transform active:scale-95">
                        Se connecter au Dashboard
                    </button>
                </div>
            </form>
        </div>

        <div class="text-center mt-8">
            <a href="/" class="text-gray-500 hover:text-white text-sm transition flex items-center justify-center">
                <i class="fa-solid fa-arrow-left mr-2"></i> Retour au site
            </a>
        </div>
    </div>
</body>
</html>
